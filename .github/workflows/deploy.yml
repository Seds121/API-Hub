name: Deploy to VPS

# Manual deploy. Requires repository secrets VPS_HOST, VPS_USER and VPS_SSH_KEY
# (the VPS must already be set up with infra/scripts/bootstrap-vps.sh).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (latest or a commit SHA)"
        required: true
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$HOST" || { echo "VPS_HOST secret is not set"; exit 1; }
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh "$USER@$HOST" "cd /opt/zeze && sudo -u zeze git pull --ff-only && sudo ./infra/scripts/deploy.sh '$TAG'"
